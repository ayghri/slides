<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Slides and research presentations by Ayoub Ghriss.">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://slides.ayghri.me/">
  <link rel="icon" type="image/svg+xml" href="./llm-recall/assets/favicon.svg">
  <title>Slides — Ayoub Ghriss</title>
  <style>
    :root { color-scheme:dark; --bg:#11161d; --ink:#f4f0e8; --muted:#b6c4d5; --line:#334153; --accent:#68dbcb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Avenir Next","Segoe UI",Arial,sans-serif; line-height:1.5; }
    .page { width:min(960px,100%); min-height:100svh; margin:auto; padding:48px 32px 28px; display:flex; flex-direction:column; }
    a { color:inherit; text-decoration:none; }
    a:focus-visible { outline:3px solid var(--accent); outline-offset:7px; border-radius:3px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:24px; }
    .name { font-size:17px; font-weight:600; }
    .website { color:var(--muted); font-size:15px; }
    header a:hover,footer a:hover { color:var(--accent); }
    main { flex:1; padding:64px 0 80px; }
    h1 { margin:0; font-size:clamp(40px,6vw,52px); font-weight:650; letter-spacing:-.055em; line-height:1.1; }
    .intro { margin:12px 0 28px; color:var(--muted); font-size:17px; }
    .talks { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
    .talks li { border-bottom:1px solid var(--line); }
    .talk { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:18px 0; }
    .talk-copy { min-width:0; }
    .talk-heading { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 14px; }
    .meta { margin:0; color:var(--muted); font-size:12px; white-space:nowrap; }
    h2 { margin:0; font-size:21px; font-weight:600; line-height:1.3; letter-spacing:-.025em; }
    .description { margin:4px 0 0; color:var(--muted); font-size:14px; }
    .talk-links { display:flex; flex-shrink:0; gap:18px; font-size:14px; }
    .talk-links a { padding:6px 0; color:var(--accent); white-space:nowrap; }
    .talk a:hover { color:var(--accent); text-decoration:underline; text-underline-offset:4px; }
    footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 24px; padding-top:24px; color:var(--muted); font-size:14px; }
    footer p { margin:0; }
    @media (max-width:560px) {
      .page { padding:28px 24px 24px; }
      main { padding:48px 0 64px; }
      .talk { align-items:flex-start; flex-direction:column; gap:8px; padding:16px 0; }
      h2 { font-size:20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="name" href="https://ayghri.me">Ayoub Ghriss</a>
      <a class="website" href="https://ayghri.me">ayghri.me ↗</a>
    </header>
    <main>
      <h1>Slides</h1>
      <p class="intro">Research talks and presentations.</p>
      <ul class="talks" aria-label="Presentations">
        <li class="talk">
          <div class="talk-copy">
            <div class="talk-heading">
              <h2 id="llm-recall-title"><a href="./llm-recall/" aria-describedby="llm-recall-meta llm-recall-description" target="_blank" rel="noopener">How LLMs recall</a></h2>
              <p class="meta" id="llm-recall-meta">20 min · 24 slides</p>
            </div>
            <p class="description" id="llm-recall-description">Associative memories, attention, and the geometry of recall.</p>
          </div>
          <div class="talk-links">
            <a href="./llm-recall/" aria-label="View How LLMs recall slides" target="_blank" rel="noopener">Slides ↗</a>
            <a href="./llm-recall/pdf/how-llms-recall.pdf" type="application/pdf" aria-label="Open How LLMs recall PDF" target="_blank" rel="noopener">PDF ↗</a>
          </div>
        </li>
      </ul>
    </main>
    <footer>
      <a href="mailto:contact@ayghir.me">contact@ayghri.me</a>
    </footer>
  </div>
</body>
</html>
